server:
  port: 8081  # 本地开发端口避开 8080（被其他应用占用）

spring:
  config:
    activate:
      on-profile: dev

  # 数据库配置 (本地开发)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:blog}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres_password}
    driver-class-name: org.postgresql.Driver
  
  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis 配置 (本地开发)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_password}

logging:
  # 本机 Windows PowerShell/CMD 默认代码页多为 GBK；控制台用 UTF-8 输出时中文路径仍会乱码，故 dev 用 GBK
  # 若已执行 chcp 65001 或使用仅 UTF-8 的终端，可改为 UTF-8
  charset:
    console: GBK
    file: UTF-8
  level:
    com.blog.api: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

# Ollama 配置（本地开发用远程服务器，生产用容器内地址 http://blog-ollama:11434）
ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  embedding-model: bge-m3
  embedding-dim: 1024
  timeout-ms: 30000

# RAG 检索增强生成配置
rag:
  top-k: 5
  min-score: 0.3
  max-context-chars: 4000
  chunk-max-chars: 800
  # 阶段五：混合检索 + 重排序
  candidate-pool: 20        # 重排序前候选池大小
  enable-rerank: false      # 是否启用 MiniMax 重排序（开启会增加一次 LLM 调用）

# 智能体配置
agent:
  timeout-seconds: 300      # 单次执行最大时长，超时中止
  enable-citation: false
