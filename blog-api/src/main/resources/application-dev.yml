spring:
  config:
    activate:
      on-profile: dev

  # 数据库配置 (本地开发)
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:blog}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres_password}
    driver-class-name: org.postgresql.Driver
  
  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis 配置 (本地开发)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_password}

logging:
  # 本机 Windows PowerShell/CMD 默认代码页多为 GBK；控制台用 UTF-8 输出时中文路径仍会乱码，故 dev 用 GBK
  # 若已执行 chcp 65001 或使用仅 UTF-8 的终端，可改为 UTF-8
  charset:
    console: GBK
    file: UTF-8
  level:
    com.blog.api: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
